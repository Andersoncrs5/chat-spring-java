spring:
  security:
    revoke:
      enabled: true

    jti:
      enabled: true

    header:
      name: Authorization
      prefix: Bearer

    refresh:
      reuse: false
      rotate: true
      max-usage: 1

    exp:
      token: 7
      refresh: 30

    jwt:
      algorithm: HS256
      issuer: chat-api
      audience: chat-client
      clock-skew-seconds: 30
      secret: 747673h4r9fgfgdgyf6t34tgydgy6t43gygyd5fd45c5ds63787324tg387g4fg983g8

  threads:
    virtual:
      enabled: true

  application:
    name: api

  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: chat
    schema-action: create_if_not_exists
    request:
      timeout: 10s
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s
    session:
      keyspace-creation-queries:
        - "CREATE KEYSPACE IF NOT EXISTS chat WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8888
