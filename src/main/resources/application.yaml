spring:
  argon:
    saltLength: 16
    hashLength: 32
    parallelism: 1
    memory: 65536
    iterations: 3

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    revoke:
      enabled: true

    jti:
      enabled: true

    header:
      name: Authorization
      prefix: Bearer

    refresh:
      reuse: false
      rotate: true
      max-usage: 1

    exp:
      token: 7
      refresh: 30

    jwt:
      algorithm: HS256
      issuer: chat-api
      audience: chat-client
      clock-skew-seconds: 30
      secret: 747673h4r9fgfgdgyf6t34tgydgy6t43gygyd5fd45c5ds63787324tg387g4fg983g8

  threads:
    virtual:
      enabled: true

  application:
    name: api

  data:
    mongodb:
      uuid-representation: standard
      auto-index-creation: true
      uri: mongodb://localhost:27017/telegram_clone?retryWrites=false
    redis:
      host: localhost
      port: 6379

server:
  port: 8888

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.mongodb.driver.protocol.command: DEBUG
    com.chat.api: DEBUG
    org.springframework.web: DEBUG

config:
  role:
    roles:
      - USER
      - ADM
      - SUPER_ADM
      - MODERATOR

  front:
    url: http://localhost:5173
    methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
    max-age: 3600
    allow-credentials: true
